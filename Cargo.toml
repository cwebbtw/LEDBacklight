[package]
name = "backlight"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "backlight"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
winit = { version = "0.30", default-features = false }
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
minifb = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
