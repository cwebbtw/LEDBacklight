[package]
name = "backlight"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "backlight"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minifb = "0.28"
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
